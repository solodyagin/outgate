              schema:
                $ref: '#/components/schemas/OperationPage'
              example:
                items:
                - operation_id: 019b76da-ae00-7000-8000-000000000001
                  committed_at: '2026-01-01T12:00:00Z'
                  service_ids: [reports]
                  operation: updateRollout
                  state: committed
                  revision: '8'
                next_cursor: null
                snapshot_revision: '8'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
