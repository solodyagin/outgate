                    version: 1.0.0
                    paths: [/api/reports]
                    mounts:
                      api: /api/reports
                    path_mode: preserve
                    rewrite_mount_headers: false
                    spki_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    artifact_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    expires_at: '2026-01-01T13:00:00Z'
                    grant_id: AAAAAAAAAAAAAAAAAAAAAA
                    revision: '8'
                    secret_available: true
                    deployment_grant: AAAAAAAAAAAAAAAAAAAAAA.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                repeat:
                  value:
                    service_id: reports
                    instance_id: reports-1
                    version: 1.0.0
                    paths: [/api/reports]
                    mounts:
                      api: /api/reports
                    path_mode: preserve
                    rewrite_mount_headers: false
                    spki_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    artifact_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    expires_at: '2026-01-01T13:00:00Z'
                    grant_id: AAAAAAAAAAAAAAAAAAAAAA
                    revision: '8'
                    secret_available: false
          headers:
            Cache-Control:
              required: true
              schema:
                const: no-store
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/revocations:
