openapi: 3.1.0
info:
  title: Outgate Admin API
  version: '1'
  description: |-
    Контракт этапа 1. Admin API доступен на выделенном listener в management network. Production использует TLS 1.3, выделенный admin CA и индивидуальные CLI credentials либо BFF mTLS + JWT audience outgate-admin-api. Development bearer допустим только на loopback в явно выбранном development. Указанные security alternatives описывают разные профили установки. Браузер работает через BFF; его endpoints, публичные и service mTLS endpoints описываются отдельно.

    Роли viewer, deployer и security_admin независимы. Для каждого действия сервер объединяет только bindings требуемой роли. Scope включает все затронутые ресурсы, в том числе обоих участников ACL и всех затронутых владельцев shared path. Для online операций security_admin обязательна проверенная MFA не старше 5 минут. У CLI JWT передаётся в X-Outgate-Admin-User-Assertion; у BFF проверяются claims JWT в Authorization. Полномочия определяются сервером. Скрытые данные исключаются из объектов, счётчиков, diff и курсоров. Для операций с x-outgate-role operation_actor повторно применяется роль и область исходной операции.

    Для каждого вызова требуется X-Outgate-Admin-API-Version: 1. В JSON запрещены дубли ключей; неизвестные поля mutating JSON отклоняются. Сервер дополнительно проверяет UTF-8 byte limits, нормализацию путей, межполевые и runtime ограничения из ТЗ. Все ошибки до заголовков используют application/problem+json. Для сервисных ссылок в path требуется percent-encoding строковых значений как отдельных параметров.

    Mutating вызовы используют UUIDv7 Idempotency-Key, expected_revision и reason. Для команд без тела обязательны If-Match и X-Outgate-Change-Reason; с JSON они опциональны и обязаны совпадать с телом. Сначала проверяются действующие права, затем committed key того же actor, endpoint, нормализованного payload и expected_revision, затем preview и текущая revision для новой команды. Preview привязан к actor, payload, точному scope и базовой revision, действует 10 минут и используется однократно. Несовпадения и просроченные keys дают 409. Запись состояния, новой revision, operation и audit outbox предшествует публикации и успешному ответу. При неизвестном результате commit следует найти запись или повторить запрос с тем же key. Повтор выдачи grant и поиск результата не возвращают секрет.

    Значения credentials в примерах синтетические. Списки используют limit и opaque cursor. Порядок по ID, для операций и аудита по времени и ID. Курсор фиксирует фильтры, actor scope и snapshot_revision; действует 10 минут. Некорректный курсор или изменённые фильтры дают 400; истёкший курсор либо недоступный снимок дают 409. Чтение и анализ сохраняют state; preview хранит только данные подтверждения.

    Требования к storage, BFF, runtime-проверкам и поддерживаемым режимам определяет ТЗ, включая разделы 3.9, 3.18–3.24, 3.26, 5.5.6 и 6.5.
servers:
- url: https://outgate-admin-api.example.net:9091
  description: Пример изолированного Admin API listener.
security:
- AdminMTLS: []
  CLIAdminToken: []
- AdminMTLS: []
  BFFAdminJWT: []
- DevelopmentAdminToken: []
paths:
  /admin/status:
    get:
      operationId: getStatus
      summary: Показать готовность слушателей и обязательных зависимостей
      x-outgate-role: viewer
      x-outgate-scope: Данные видимых сервисов и безопасные сводные статусы шлюза.
      x-outgate-mutating: false
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                observed_at: '2026-01-01T12:00:00Z'
                ready: false
                security_mode: production
                listeners:
                - name: admin
                  state: ready
                dependencies:
                - name: replay
                  state: recovering
                quota: []
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/tunnels:
    get:
      operationId: listTunnels
      summary: Показать зарегистрированные и дренируемые экземпляры
      x-outgate-role: viewer
      x-outgate-scope: Только экземпляры видимых сервисов.
      x-outgate-mutating: false
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Filter_service_id'
      - $ref: '#/components/parameters/Filter_version'
      - $ref: '#/components/parameters/Filter_transport'
      - $ref: '#/components/parameters/Filter_tunnel_state'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunnelPage'
              example:
                items:
                - service_id: reports
                  version: 1.0.0
                  instance_id: reports-1
                  transport: quic
                  state: ready
                  role: null
                  paths: [/api/reports]
                  path_mode: preserve
                  rewrite_mount_headers: false
                  connected_since: '2026-01-01T12:00:00Z'
                  credential_expires_at: '2026-01-01T13:00:00Z'
                  grant_id: AAAAAAAAAAAAAAAAAAAAAA
                  certificate_serial: 71ab
                  active_passive: null
                next_cursor: null
                snapshot_revision: '7'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/routes:
    get:
      operationId: listRoutes
      summary: Показать владение, включая pending, недоступные и retired префиксы
      x-outgate-role: viewer
      x-outgate-scope: Только видимые владельцы префикса, экземпляры и frontend override.
      x-outgate-mutating: false
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Filter_service_id'
      - $ref: '#/components/parameters/Filter_version'
      - $ref: '#/components/parameters/Filter_transport'
      - $ref: '#/components/parameters/Filter_route_state'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
              example:
                items:
                - path: /api/reports
                  owners:
                  - service_id: reports
                    state: active
                    instances:
                    - service_id: reports
                      version: 1.0.0
                      instance_id: reports-1
                      transport: quic
                      state: ready
                      role: null
                    active_passive: []
                next_cursor: null
                snapshot_revision: '7'
                frontend_override:
                  enabled: false
                  service_id: null
                  state: disabled
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/services/{service_id}/versions:
    get:
      operationId: listVersions
      summary: Показать обнаруженные версии, в том числе версии без готовых экземпляров
      x-outgate-role: viewer
      x-outgate-scope: Разрешённый сервис из path или тела запроса.
      x-outgate-mutating: false
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/ServicePath'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Filter_version'
      - $ref: '#/components/parameters/Filter_transport'
      - $ref: '#/components/parameters/Filter_version_state'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
              example:
                items:
                - service_id: reports
                  version: 1.0.0
                  first_seen: '2026-01-01T12:00:00Z'
                  last_seen: '2026-01-01T12:00:00Z'
                  state: discovered
                  active_instances: 1
                  paths: [/api/reports]
                  transports: [quic]
                  instances:
                  - service_id: reports
                    version: 1.0.0
                    instance_id: reports-1
                    transport: quic
                    state: ready
                    role: null
                next_cursor: null
                snapshot_revision: '7'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/services/{service_id}/rollout:
    get:
      operationId: getRollout
      summary: Прочитать текущую политику распределения с её ревизией
      x-outgate-role: viewer
      x-outgate-scope: Разрешённый сервис из path или тела запроса.
      x-outgate-mutating: false
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/ServicePath'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rollout'
              example:
                stable_version: 1.0.0
                canary_version: null
                canary_percent: 0
                previous_stable_version: null
                updated_at: '2026-01-01T12:00:00Z'
                revision: '7'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: updateRollout
      summary: Атомарно заменить stable, canary и процент
      x-outgate-role: deployer
      x-outgate-scope: Разрешённый сервис из path или тела запроса.
      x-outgate-mutating: true
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/ServicePath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatchIfPresent'
      - $ref: '#/components/parameters/ChangeReasonIfPresent'
      description: Атомарно заменить stable, canary и процент. Canary 0% допустима при недоступной canary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloutUpdate'
            example:
              stable_version: 1.0.0
              canary_version: null
              canary_percent: 0
              expected_revision: '7'
              reason: deploy
      responses:
        '200':
          description: Команда применена либо возвращён ранее зафиксированный результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rollout'
              example:
                stable_version: 1.0.0
                canary_version: null
                canary_percent: 0
                previous_stable_version: null
                updated_at: '2026-01-01T12:00:00Z'
                revision: '8'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/services/{service_id}/rollout/promote:
    post:
      operationId: promoteRollout
      summary: Продвинуть текущую canary и сохранить старую stable в previous_stable_version
      x-outgate-role: deployer
      x-outgate-scope: Разрешённый сервис из path или тела запроса.
      x-outgate-mutating: true
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/ServicePath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/ChangeReason'
      description: Продвинуть текущую canary и сохранить старую stable в previous_stable_version. Без canary возвращается
        409.
      responses:
        '200':
          description: Команда применена либо возвращён ранее зафиксированный результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rollout'
              example:
                stable_version: 1.1.0
                canary_version: null
                canary_percent: 0
                previous_stable_version: 1.0.0
                updated_at: '2026-01-01T12:00:00Z'
                revision: '8'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/services/{service_id}/rollout/rollback:
    post:
      operationId: rollbackRollout
      summary: Снять canary или восстановить доступную previous_stable_version по условиям ТЗ 3.5
      x-outgate-role: deployer
      x-outgate-scope: Разрешённый сервис из path или тела запроса.
      x-outgate-mutating: true
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/ServicePath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/ChangeReason'
      responses:
        '200':
          description: Команда применена либо возвращён ранее зафиксированный результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rollout'
              example:
                stable_version: 1.0.0
                canary_version: null
                canary_percent: 0
                previous_stable_version: null
                updated_at: '2026-01-01T12:00:00Z'
                revision: '8'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/services/{service_id}/versions/{version}/active-instance:
    post:
      operationId: switchPrimary
      summary: Выбрать готовый primary из order этой active-passive версии с полным покрытием путей
      x-outgate-role: deployer
      x-outgate-scope: Разрешённый сервис из path или тела запроса.
      x-outgate-mutating: true
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/ServicePath'
      - $ref: '#/components/parameters/VersionPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatchIfPresent'
      - $ref: '#/components/parameters/ChangeReasonIfPresent'
      security:
      - AdminMTLS: []
        CLIAdminToken: []
      - AdminMTLS: []
        BFFAdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveInstanceUpdate'
            example:
              instance_id: reports-2
              expected_revision: '7'
              reason: deploy
      responses:
        '200':
          description: Команда применена либо возвращён ранее зафиксированный результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveInstanceResult'
              example:
                service_id: reports
                version: 1.0.0
                revision: '8'
                pool:
                  instance_order: [reports-1, reports-2]
                  primary_instance_id: reports-2
                  last_switch_reason: manual
                  last_switch_at: '2026-01-01T12:00:00Z'
                  status: available
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/interservice-access:
    get:
      operationId: getInterserviceAccess
      summary: Прочитать видимую проекцию политики и её базовую ревизию
      x-outgate-role: viewer
      x-outgate-scope: Явная scope_service_ids. Для каждой видимой пары caller/target требуется scope обоих сервисов.
      x-outgate-mutating: false
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessState'
              example:
                snapshot:
                  policies: []
                  internal_only: []
                scope_service_ids: [reports]
                revision: '7'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: updateInterserviceAccess
      summary: Применить видимую проекцию после подтверждения без удаления чужих правил
      x-outgate-role: security_admin
      x-outgate-scope: Явная scope_service_ids. Для каждой видимой пары caller/target требуется scope обоих сервисов.
      x-outgate-mutating: true
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatchIfPresent'
      - $ref: '#/components/parameters/ChangeReasonIfPresent'
      description: Применить видимую проекцию после подтверждения без удаления чужих правил. Перепроверить свежую MFA и preview.
        Сужение полномочий запускает переоценку соответствующих открытых потоков.
      x-outgate-additional-roles: [viewer]
      security:
      - AdminMTLS: []
        CLIAdminToken: []
        CLIAdminAssertion: []
      - AdminMTLS: []
        BFFAdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessUpdate'
            example:
              candidate:
                policies: []
                internal_only: []
              scope_service_ids: [reports]
              preview_id: BBBBBBBBBBBBBBBBBBBBBA
              expected_revision: '7'
              reason: deploy
      responses:
        '200':
          description: Команда применена либо возвращён ранее зафиксированный результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessState'
              example:
                snapshot:
                  policies: []
                  internal_only: []
                scope_service_ids: [reports]
                revision: '8'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/interservice-access/validate:
    post:
      operationId: validateInterserviceAccess
      summary: Проверить черновик и выпустить preview на 10 минут
      x-outgate-role: viewer
      x-outgate-scope: Явная scope_service_ids. Для каждой видимой пары caller/target требуется scope обоих сервисов.
      x-outgate-mutating: false
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      description: Проверить черновик и выпустить preview на 10 минут. Ошибки полей возвращаются с 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessValidation'
            example:
              candidate:
                policies: []
                internal_only: []
              scope_service_ids: [reports]
              expected_revision: '7'
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPreview'
              example:
                preview_id: BBBBBBBBBBBBBBBBBBBBBA
                expires_at: '2026-01-01T12:10:00Z'
                revision: '7'
                diff: []
                potentially_closed_streams: '0'
                valid: true
                access_diff:
                  policies_added: []
                  policies_removed: []
                  internal_only_added: []
                  internal_only_removed: []
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
