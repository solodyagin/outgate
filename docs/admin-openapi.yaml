  /admin/operations/{operation_id}:
    get:
      operationId: getOperation
      summary: Найти зафиксированный результат по Idempotency-Key
      x-outgate-role: operation_actor
      x-outgate-scope: Тот же actor и текущее покрытие service scope операции. Чужой результат скрыт.
      x-outgate-mutating: false
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/OperationPath'
      description: Найти зафиксированный результат по Idempotency-Key. Повторно проверяются права исходной операции. При отсутствии
        доступного результата возвращается 404 unknown.
      responses:
        '200':
          description: Успешный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
              example:
                operation_id: 019b76da-ae00-7000-8000-000000000001
                committed_at: '2026-01-01T12:00:00Z'
                service_ids: [reports]
                operation: updateRollout
                state: committed
                revision: '8'
                result:
                  stable_version: 1.0.0
                  canary_version: null
                  canary_percent: 0
                  previous_stable_version: null
                  updated_at: '2026-01-01T12:00:00Z'
                  revision: '8'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    AdminMTLS:
      type: mutualTLS
      description: Production admin CA. CLI и BFF certificate identity имеют отдельные полномочия.
    CLIAdminToken:
      type: http
      scheme: bearer
      description: Индивидуальный CLI admin token в паре с CLI mTLS.
    BFFAdminJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Только BFF delegation certificate и admin access JWT пользователя от настроенного issuer.
    CLIAdminAssertion:
      type: apiKey
      in: header
      name: X-Outgate-Admin-User-Assertion
      description: Обязателен для production CLI с ролью security_admin. Секретный admin JWT, привязанный к user_subject CLI
        principal. Для BFF проверяется admin JWT из Authorization.
    DevelopmentAdminToken:
      type: http
      scheme: bearer
      description: Отдельный admin bearer, только development loopback.
  parameters:
    APIVersion:
      name: X-Outgate-Admin-API-Version
      in: header
      required: true
      schema:
        type: string
        const: '1'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/OperationID'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]{1}|1844674407370955161[0-4]|18446744073709551615)"$(?![\s\S])
      description: Ровно одна ревизия в кавычках. При передаче JSON заголовок, если указан, должен совпадать с expected_revision.
      example: '"7"'
    ChangeReason:
      name: X-Outgate-Change-Reason
      in: header
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 683
        pattern: ^[A-Za-z0-9_-]+$(?![\s\S])
      description: Base64url без padding от UTF-8 reason длиной 1–512 байт. При передаче JSON декодированное значение должно
        совпадать с reason.
      example: ZGVwbG95
    IfMatchIfPresent:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: ^"(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]{1}|1844674407370955161[0-4]|18446744073709551615)"$(?![\s\S])
      description: Ровно одна ревизия в кавычках. При передаче JSON заголовок, если указан, должен совпадать с expected_revision.
      example: '"7"'
    ChangeReasonIfPresent:
      name: X-Outgate-Change-Reason
      in: header
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 683
        pattern: ^[A-Za-z0-9_-]+$(?![\s\S])
      description: Base64url без padding от UTF-8 reason длиной 1–512 байт. При передаче JSON декодированное значение должно
        совпадать с reason.
      example: ZGVwbG95
    ServicePath:
      name: service_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ServiceID'
    VersionPath:
      name: version
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Version'
    InstancePath:
      name: instance_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    OperationPath:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OperationID'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    Filter_service_id:
      name: service_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ServiceID'
    Filter_version:
      name: version
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Version'
    Filter_transport:
      name: transport
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Transport'
    Filter_route_state:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/RouteState'
    Filter_tunnel_state:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TunnelState'
    Filter_version_state:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [discovered, retired]
    Filter_grant_state:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [active, expired, revoked]
    Filter_audit_state:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [committed, rejected]
    Filter_operation_state:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [committed]
  responses:
    InvalidRequest:
      description: Отсутствует или не поддерживается версия Admin API, некорректны параметры, JSON или timestamp нового operation
        key.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                status:
                  const: 400
                code:
                  type: string
                  enum: [unsupported_admin_api_version, invalid_request, invalid_cursor, invalid_operation_key, invalid_snapshot]
                reason:
                  type: string
                  enum: [unsupported_admin_api_version, invalid_request, invalid_cursor, invalid_operation_key, invalid_snapshot]
          example:
            type: urn:outgate:problem:unsupported_admin_api_version
            title: InvalidRequest
            status: 400
            detail: Отсутствует или не поддерживается версия Admin API, некорректны параметры, JSON или timestamp нового operation
              key.
            instance: urn:outgate:request:admin-example
            code: unsupported_admin_api_version
            reason: unsupported_admin_api_version
            request_id: admin-example
    Unauthorized:
      description: Отсутствуют или недействительны credentials. Отказ mTLS может произойти до HTTP.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                status:
                  const: 401
                code:
                  type: string
                  enum: [unauthenticated]
                reason:
                  type: string
                  enum: [unauthenticated]
          example:
            type: urn:outgate:problem:unauthenticated
            title: Unauthorized
            status: 401
            detail: Отсутствуют или недействительны credentials. Отказ mTLS может произойти до HTTP.
            instance: urn:outgate:request:admin-example
            code: unauthenticated
            reason: unauthenticated
            request_id: admin-example
    Forbidden:
      description: Требуемая роль, область или свежая MFA недоступны.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                status:
                  const: 403
                code:
                  type: string
                  enum: [forbidden, fresh_mfa_required]
                reason:
                  type: string
                  enum: [forbidden, fresh_mfa_required]
          example:
            type: urn:outgate:problem:forbidden
            title: Forbidden
            status: 403
            detail: Требуемая роль, область или свежая MFA недоступны.
            instance: urn:outgate:request:admin-example
            code: forbidden
            reason: forbidden
            request_id: admin-example
    NotFound:
      description: Объект отсутствует или скрыт в области проверяющего actor. Для поиска неизвестной операции используется
        unknown.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                status:
                  const: 404
                code:
                  type: string
                  enum: [not_found, unknown]
                reason:
                  type: string
                  enum: [not_found, unknown]
          example:
            type: urn:outgate:problem:not_found
            title: NotFound
            status: 404
            detail: Объект отсутствует или скрыт в области проверяющего actor. Для поиска неизвестной операции используется
              unknown.
            instance: urn:outgate:request:admin-example
            code: not_found
            reason: not_found
            request_id: admin-example
    Conflict:
      description: Устарела revision, preview или страница; key просрочен или уже привязан к другой операции; условия изменения
        не выполнены.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                status:
                  const: 409
                code:
                  type: string
                  enum: [revision_conflict, operation_conflict, operation_key_expired, preview_conflict, snapshot_expired,
                    state_conflict]
                reason:
                  type: string
                  enum: [revision_conflict, operation_conflict, operation_key_expired, preview_conflict, snapshot_expired,
                    state_conflict]
          example:
            type: urn:outgate:problem:revision_conflict
            title: Conflict
            status: 409
            detail: Устарела revision, preview или страница; key просрочен или уже привязан к другой операции; условия изменения
              не выполнены.
            instance: urn:outgate:request:admin-example
            code: revision_conflict
            reason: revision_conflict
            request_id: admin-example
    UnsupportedMediaType:
      description: Этот метод требует application/json для тела запроса.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                status:
                  const: 415
                code:
                  type: string
                  enum: [unsupported_media_type]
                reason:
                  type: string
                  enum: [unsupported_media_type]
          example:
            type: urn:outgate:problem:unsupported_media_type
            title: UnsupportedMediaType
            status: 415
            detail: Этот метод требует application/json для тела запроса.
            instance: urn:outgate:request:admin-example
            code: unsupported_media_type
            reason: unsupported_media_type
            request_id: admin-example
    RateLimited:
      description: Достигнут лимит запросов Admin API.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                status:
                  const: 429
                code:
                  type: string
                  enum: [rate_limited]
                reason:
                  type: string
                  enum: [rate_limited]
          example:
            type: urn:outgate:problem:rate_limited
            title: RateLimited
            status: 429
            detail: Достигнут лимит запросов Admin API.
            instance: urn:outgate:request:admin-example
            code: rate_limited
            reason: rate_limited
            request_id: admin-example
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
    Unavailable:
      description: Обязательное состояние или локальная очередь аудита недоступны либо результат commit неизвестен.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Problem'
            - properties:
                status:
                  const: 503
                code:
                  type: string
                  enum: [state_unavailable, audit_unavailable, operation_outcome_unknown]
                reason:
                  type: string
                  enum: [state_unavailable, audit_unavailable, operation_outcome_unknown]
          example:
            type: urn:outgate:problem:state_unavailable
            title: Unavailable
            status: 503
            detail: Обязательное состояние или локальная очередь аудита недоступны либо результат commit неизвестен.
            instance: urn:outgate:request:admin-example
            code: state_unavailable
            reason: state_unavailable
            request_id: admin-example
  schemas:
    Revision:
      type: string
      minLength: 1
      maxLength: 20
      pattern: ^(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]{1}|1844674407370955161[0-4]|18446744073709551615)$(?![\s\S])
    Timestamp:
      type: string
      format: date-time
    ID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$(?![\s\S])
    ServiceID:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$(?![\s\S])
    Version:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^(?=.*\S)[^\u0000-\u001f\u007f-\u009f]+$(?![\s\S])
      description: Непустой ID сборки. Сервер также проверяет предел 128 байт UTF-8 и отсутствие управляющих символов.
    Prefix:
      type: string
      minLength: 1
      maxLength: 8192
      pattern: ^(?!.*//)(?!.*[/]\.{1,2}(?:/|$))/[^\s%?#\\\u0000-\u001f\u007f-\u009f]*$(?![\s\S])
      description: Публичный префикс по ТЗ 3.3. Сервер проверяет байтовый лимит, нормализует завершающий слеш, проверяет допустимость
        корня и совпадение по границе сегмента.
    Transport:
      type: string
      enum: [quic, wss]
    PathMode:
      type: string
      enum: [preserve, strip]
    InstanceRole:
      type: string
      enum: [primary, standby, unavailable]
    TunnelState:
      type: string
      enum: [registered, ready, draining]
    RouteState:
      type: string
      enum: [pending, active, retired]
    FrontendState:
      type: string
      enum: [disabled, awaiting_registration, active, unavailable]
    RolloutStatus:
      type: string
      enum: [available, degraded, no_ready_replica]
    SwitchReason:
      type: string
      enum: [disconnect, not_ready, drain, revoked, manual, preempt]
    Reason:
      type: string
      minLength: 1
      maxLength: 512
      pattern: \S
      description: Непустая причина. Сервер проверяет длину 1–512 байт UTF-8.
    OperationID:
      type: string
      minLength: 36
      maxLength: 36
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$(?![\s\S])
      description: Каноническая запись UUIDv7. Сервер проверяет возраст не более 30 дней и допуск будущего времени 30 секунд.
    PreviewID:
      type: string
      minLength: 1
      maxLength: 256
      pattern: ^[A-Za-z0-9_-]+$(?![\s\S])
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[A-Za-z0-9_-]+$(?![\s\S])
    GrantID:
      type: string
      minLength: 22
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$(?![\s\S])
    SHA256:
      type: string
      minLength: 64
      maxLength: 64
      pattern: ^[0-9a-f]{64}$(?![\s\S])
    Method:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[!#$%&'+.^_`|~A-Za-z0-9-]+$(?![\s\S])
    ServiceScope:
      oneOf:
      - type: array
        items:
          $ref: '#/components/schemas/ServiceID'
        minItems: 1
        uniqueItems: true
      - const: ['*']
      description: Явные service IDs либо единственный *. Значение * доступно только глобальному binding соответствующей роли.
    Bool:
      type: boolean
    ProblemCode:
      type: string
      enum: [unsupported_admin_api_version, invalid_request, invalid_cursor, invalid_operation_key, invalid_snapshot, unauthenticated,
        forbidden, fresh_mfa_required, not_found, unknown, revision_conflict, operation_conflict, operation_key_expired, preview_conflict,
        snapshot_expired, state_conflict, unsupported_media_type, rate_limited, state_unavailable, audit_unavailable, operation_outcome_unknown]
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 512
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$(?![\s\S])
      required: [field, code]
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          minLength: 1
          pattern: ^urn:outgate:request:[A-Za-z0-9._~-]{1,128}$(?![\s\S])
        code:
          $ref: '#/components/schemas/ProblemCode'
        reason:
          $ref: '#/components/schemas/ProblemCode'
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$(?![\s\S])
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          minItems: 1
      required: [type, title, status, detail, instance, code, reason, request_id]
      description: RFC 9457. reason всегда равен code; instance включает тот же request_id. Detail, errors и другие поля содержат
        только безопасные данные.
    InstanceRef:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: '#/components/schemas/ServiceID'
        version:
          $ref: '#/components/schemas/Version'
        instance_id:
          $ref: '#/components/schemas/ID'
        transport:
          $ref: '#/components/schemas/Transport'
        state:
          $ref: '#/components/schemas/TunnelState'
        role:
          anyOf:
          - $ref: '#/components/schemas/InstanceRole'
          - type: 'null'
      required: [service_id, version, instance_id, transport, state, role]
    ActivePassive:
      type: object
      additionalProperties: false
      properties:
        instance_order:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          minItems: 1
          uniqueItems: true
        primary_instance_id:
          anyOf:
          - $ref: '#/components/schemas/ID'
          - type: 'null'
        last_switch_reason:
          anyOf:
          - $ref: '#/components/schemas/SwitchReason'
          - type: 'null'
        last_switch_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        status:
          $ref: '#/components/schemas/RolloutStatus'
      required: [instance_order, primary_instance_id, last_switch_reason, last_switch_at, status]
    FrontendOverride:
      type: object
      additionalProperties: false
      properties:
        enabled:
          $ref: '#/components/schemas/Bool'
        service_id:
          anyOf:
          - $ref: '#/components/schemas/ServiceID'
          - type: 'null'
        state:
          $ref: '#/components/schemas/FrontendState'
      required: [enabled, service_id, state]
    Tunnel:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: '#/components/schemas/ServiceID'
        version:
          $ref: '#/components/schemas/Version'
        instance_id:
          $ref: '#/components/schemas/ID'
        transport:
          $ref: '#/components/schemas/Transport'
        state:
          $ref: '#/components/schemas/TunnelState'
        role:
          anyOf:
          - $ref: '#/components/schemas/InstanceRole'
          - type: 'null'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/Prefix'
          minItems: 1
          maxItems: 32
          uniqueItems: true
        path_mode:
          $ref: '#/components/schemas/PathMode'
        rewrite_mount_headers:
          $ref: '#/components/schemas/Bool'
        connected_since:
          $ref: '#/components/schemas/Timestamp'
        credential_expires_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        grant_id:
          anyOf:
          - $ref: '#/components/schemas/GrantID'
          - type: 'null'
        certificate_serial:
          type: [string, 'null']
        active_passive:
          anyOf:
          - $ref: '#/components/schemas/ActivePassive'
          - type: 'null'
      required: [service_id, version, instance_id, transport, state, role, paths, path_mode, rewrite_mount_headers, connected_since,
        credential_expires_at, grant_id, certificate_serial, active_passive]
    RouteOwner:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: '#/components/schemas/ServiceID'
        state:
          $ref: '#/components/schemas/RouteState'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/InstanceRef'
        active_passive:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              version:
                $ref: '#/components/schemas/Version'
              pool:
                $ref: '#/components/schemas/ActivePassive'
            required: [version, pool]
      required: [service_id, state, instances, active_passive]
    Route:
      type: object
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/Prefix'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/RouteOwner'
          minItems: 1
      required: [path, owners]
    ServiceVersion:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: '#/components/schemas/ServiceID'
        version:
          $ref: '#/components/schemas/Version'
        first_seen:
          $ref: '#/components/schemas/Timestamp'
        last_seen:
          $ref: '#/components/schemas/Timestamp'
        state:
          type: string
          enum: [discovered, retired]
        active_instances:
          type: integer
          minimum: 0
          maximum: 2147483647
        paths:
          type: array
          items:
            $ref: '#/components/schemas/Prefix'
          uniqueItems: true
        transports:
          type: array
          items:
            $ref: '#/components/schemas/Transport'
          maxItems: 2
          uniqueItems: true
        instances:
          type: array
          items:
            $ref: '#/components/schemas/InstanceRef'
      required: [service_id, version, first_seen, last_seen, state, active_instances, paths, transports, instances]
    RolloutUpdate:
      type: object
      additionalProperties: false
      properties:
        stable_version:
          $ref: '#/components/schemas/Version'
        canary_version:
          anyOf:
          - $ref: '#/components/schemas/Version'
          - type: 'null'
        canary_percent:
          type: integer
          minimum: 0
          maximum: 100
        expected_revision:
          $ref: '#/components/schemas/Revision'
        reason:
          $ref: '#/components/schemas/Reason'
      required: [stable_version, canary_version, canary_percent, expected_revision, reason]
      if:
        properties:
          canary_version:
            type: 'null'
      then:
        properties:
          canary_percent:
            const: 0
      description: Stable и canary различаются. Сервер проверяет покрытие путей, mount bindings и active-passive order для
        включаемых версий.
    Rollout:
      type: object
      additionalProperties: false
      properties:
        stable_version:
          $ref: '#/components/schemas/Version'
        canary_version:
          anyOf:
          - $ref: '#/components/schemas/Version'
          - type: 'null'
        canary_percent:
          type: integer
          minimum: 0
          maximum: 100
        previous_stable_version:
          anyOf:
          - $ref: '#/components/schemas/Version'
          - type: 'null'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        revision:
          $ref: '#/components/schemas/Revision'
      required: [stable_version, canary_version, canary_percent, previous_stable_version, updated_at, revision]
      if:
        properties:
          canary_version:
            type: 'null'
      then:
        properties:
          canary_percent:
            const: 0
    Status:
      type: object
      additionalProperties: false
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        ready:
          $ref: '#/components/schemas/Bool'
        security_mode:
          type: string
          enum: [production, development]
        listeners:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                enum: [public, quic, wss, interservice, admin, observability]
              state:
                type: string
                enum: [ready, unavailable, disabled]
            required: [name, state]
        dependencies:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                enum: [control, replay, revocations, identity, audit]
              state:
                type: string
                enum: [ready, unavailable, recovering, disabled]
            required: [name, state]
        quota:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                $ref: '#/components/schemas/ID'
              used:
                $ref: '#/components/schemas/Revision'
              limit:
                $ref: '#/components/schemas/Revision'
            required: [name, used, limit]
      required: [observed_at, ready, security_mode, listeners, dependencies, quota]
      description: Доступен в recovery авторизованным читателям. Возвращает безопасную диагностику с учётом области просмотра.
    AccessPolicy:
      type: object
      additionalProperties: false
      properties:
        caller:
          $ref: '#/components/schemas/ServiceID'
        target:
          $ref: '#/components/schemas/ServiceID'
        paths:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Prefix'
            - not:
                const: /
          minItems: 1
          uniqueItems: true
        methods:
          type: array
          items:
            $ref: '#/components/schemas/Method'
          minItems: 1
          uniqueItems: true
        allow_user_context:
          $ref: '#/components/schemas/Bool'
        allow_background:
          $ref: '#/components/schemas/Bool'
      required: [caller, target, paths, methods, allow_user_context, allow_background]
    InternalOnly:
      type: object
      additionalProperties: false
      properties:
        target:
          $ref: '#/components/schemas/ServiceID'
        paths:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Prefix'
            - not:
                const: /
          minItems: 1
          uniqueItems: true
        methods:
          type: array
          items:
            $ref: '#/components/schemas/Method'
          minItems: 1
          uniqueItems: true
        callers:
          type: array
          items:
            $ref: '#/components/schemas/ServiceID'
          minItems: 1
          uniqueItems: true
      required: [target, paths, methods, callers]
    AccessSnapshot:
      type: object
      additionalProperties: false
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicy'
          uniqueItems: true
        internal_only:
          type: array
          items:
            $ref: '#/components/schemas/InternalOnly'
          uniqueItems: true
      required: [policies, internal_only]
    AccessState:
      type: object
      additionalProperties: false
      properties:
        snapshot:
          $ref: '#/components/schemas/AccessSnapshot'
        scope_service_ids:
          $ref: '#/components/schemas/ServiceScope'
        revision:
          $ref: '#/components/schemas/Revision'
      required: [snapshot, scope_service_ids, revision]
    AccessValidation:
      type: object
      additionalProperties: false
      properties:
        candidate:
          $ref: '#/components/schemas/AccessSnapshot'
        scope_service_ids:
          $ref: '#/components/schemas/ServiceScope'
        expected_revision:
          $ref: '#/components/schemas/Revision'
      required: [candidate, scope_service_ids, expected_revision]
    AccessUpdate:
      type: object
      additionalProperties: false
      properties:
        candidate:
          $ref: '#/components/schemas/AccessSnapshot'
        scope_service_ids:
          $ref: '#/components/schemas/ServiceScope'
        expected_revision:
          $ref: '#/components/schemas/Revision'
        preview_id:
          $ref: '#/components/schemas/PreviewID'
        reason:
          $ref: '#/components/schemas/Reason'
      required: [candidate, scope_service_ids, expected_revision, preview_id, reason]
    AccessEvaluation:
      type: object
      additionalProperties: false
      properties:
        caller:
          $ref: '#/components/schemas/ServiceID'
        target:
          $ref: '#/components/schemas/ServiceID'
        path:
          $ref: '#/components/schemas/Prefix'
        method:
          $ref: '#/components/schemas/Method'
        context:
          type: string
          enum: [background, user]
        candidate:
          $ref: '#/components/schemas/AccessSnapshot'
        expected_revision:
          $ref: '#/components/schemas/Revision'
      required: [caller, target, path, method, context]
      dependentRequired:
        candidate: [expected_revision]
      description: Если candidate отсутствует, анализируется текущая видимая проекция. При candidate моделируется черновик
        для указанной base revision.
    AccessDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [allow, deny]
        reason:
          type: string
          enum: [allowed, no_matching_rule, context_forbidden, internal_only]
        matching_rules:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicy'
        revision:
          $ref: '#/components/schemas/Revision'
      required: [decision, reason, matching_rules, revision]
      description: Модель доступа для заданных условий. Полномочия JWT, credentials и состояние экземпляра определяются при
        реальном запросе.
    AccessDelta:
      type: object
      additionalProperties: false
      properties:
        policies_added:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicy'
        policies_removed:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicy'
        internal_only_added:
          type: array
          items:
            $ref: '#/components/schemas/InternalOnly'
        internal_only_removed:
          type: array
          items:
            $ref: '#/components/schemas/InternalOnly'
      required: [policies_added, policies_removed, internal_only_added, internal_only_removed]
    SafeChange:
      type: object
      additionalProperties: false
      properties:
        resource:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$(?![\s\S])
        service_ids:
          type: array
          items:
            $ref: '#/components/schemas/ServiceID'
          uniqueItems: true
        action:
          type: string
          enum: [add, update, remove]
        summary:
          type: string
          minLength: 1
          maxLength: 512
      required: [resource, service_ids, action, summary]
      description: Санитизированное описание, сформированное сервером. Секреты, полные JWT и подписи, DSN и сырые конфиги
        исключаются.
    Preview:
      type: object
      additionalProperties: false
      properties:
        preview_id:
          $ref: '#/components/schemas/PreviewID'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        revision:
          $ref: '#/components/schemas/Revision'
        diff:
          type: array
          items:
            $ref: '#/components/schemas/SafeChange'
        potentially_closed_streams:
          $ref: '#/components/schemas/Revision'
      required: [preview_id, expires_at, revision, diff, potentially_closed_streams]
    AccessPreview:
      type: object
      additionalProperties: false
      properties:
        preview_id:
          $ref: '#/components/schemas/PreviewID'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        revision:
          $ref: '#/components/schemas/Revision'
        diff:
          type: array
          items:
            $ref: '#/components/schemas/SafeChange'
        potentially_closed_streams:
