      x-outgate-role: viewer
      x-outgate-scope: Тот же actor и текущее покрытие service scope операции. Чужой результат скрыт.
      x-outgate-mutating: false
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Filter_service_id'
      - $ref: '#/components/parameters/Filter_operation_state'
      responses:
        '200':
          description: Успешный ответ.
          content:
