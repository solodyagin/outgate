      x-outgate-role: security_admin
      x-outgate-scope: Область отзываемого сервиса или ключа.
      x-outgate-mutating: true
      parameters:
      - $ref: '#/components/parameters/APIVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatchIfPresent'
      - $ref: '#/components/parameters/ChangeReasonIfPresent'
      description: Зафиксировать отзыв service identity, SPKI, certificate serial, grant либо HMAC key. Отзыв применяется
        к затронутым потокам в пределах 5 секунд.
      security:
      - AdminMTLS: []
        CLIAdminToken: []
        CLIAdminAssertion: []
      - AdminMTLS: []
        BFFAdminJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeCredential'
            example:
              target:
                kind: grant_id
                service_id: reports
                value: AAAAAAAAAAAAAAAAAAAAAA
              expected_revision: '7'
              reason: deploy
      responses:
        '200':
          description: Команда применена либо возвращён ранее зафиксированный результат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationResult'
              example:
                target:
                  kind: grant_id
                  service_id: reports
                  value: AAAAAAAAAAAAAAAAAAAAAA
                cursor: '9'
                revision: '8'
                revoked_at: '2026-01-01T12:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/audit:
