name: Contract checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/fixtures/protocol/v1/verify.py
      - run: python -m pip install -r tests/requirements-contracts.txt
      - run: python -B tests/verify_protocol_schema.py
      - run: python -B tests/verify_admin_openapi.py
      - run: python -B tests/verify_config.py
      - run: python -B tests/verify_credentials.py
      - run: python -B tests/verify_discovery.py
      - run: python -B -m unittest discover -s tests -p "test_*.py"
      - run: python -B tests/check_local_paths.py
      - run: go mod verify
        env:
          GOWORK: 'off'
      - run: python -B tests/verify_sbom.py
      - run: go test ./...
        env:
          GOWORK: 'off'
      - run: go vet ./...
        env:
          GOWORK: 'off'
      - name: Check pinned transport and storage dependencies
        working-directory: tests/dependencies
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: go test -mod=readonly ./...
      - run: go vet -mod=readonly ./...
        working-directory: tests/dependencies
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
      - run: python -B verify_sbom.py
        working-directory: tests/dependencies
      - if: runner.os == 'Linux'
        run: go test -race ./...
        env:
          GOWORK: 'off'
