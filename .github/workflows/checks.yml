name: Protocol contract

on: [push, pull_request]

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/fixtures/protocol/v1/verify.py
