name: Contract checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/fixtures/protocol/v1/verify.py
      - run: python -m pip install -r tests/requirements-contracts.txt
      - run: python -B tests/verify_admin_openapi.py
      - run: python -B tests/verify_config.py
      - run: python -B -m unittest discover -s tests -p "test_check_local_paths.py"
      - run: python -B tests/check_local_paths.py
